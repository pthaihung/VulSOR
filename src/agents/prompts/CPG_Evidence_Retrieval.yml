tool: SelectiveRepositoryEvidenceRetrieval
role: Optional source-level summarizer for Joern/CPG query results
is_llm_reasoning_agent: false
output_format: json

inputs:
  cpg_query_result: Joern/CPG query result already mapped to source-level locations.
  anchored_operation: Operation that requested repository evidence.

prompt_template: |
  cpg_query:
    source_level_mapped: true
    result: |
      {cpg_query_result}

  anchored_operation: |
    {anchored_operation}

  task: >
    Summarize only the supplied Joern/CPG query result into source-level facts relevant to the anchored operation.
    Do not infer behavior that is not present in the CPG result.
    Do not decide vulnerable/benign.
    Do not assign CWE/CVE.
    If the CPG result is empty or insufficient, return repository_evidence as an empty list and record a limitation.

  output_format: json
  output_format_rules:
    - Return exactly one valid JSON object.
    - Do not return Markdown, YAML, code fences, or prose outside JSON.
    - Follow the output_schema exactly.

  return_json_schema:
    repository_evidence:
      - entity: string
        relation: string
        condition: string
        evidence: repo:file:line
    limitations:
      - string

output_schema:
  repository_evidence:
    - entity: string
      relation: string
      condition: string
      evidence: repo:file:line
  limitations:
    - string
