agent: Execution
role: Safety-bearing execution condition extractor
output_format: json

inputs:
  numbered_function_code:
    source: dataset.inputs[].code
    description: Full target C/C++ function with original line numbers.

system_prompt: |
  Independently reconstruct only execution/path conditions that can materially
  constrain safety-relevant states or values in the supplied function.

  Macro definitions that are explicitly present in the supplied target function are
  part of the available semantics. Follow their visible assignments, pointer updates,
  and control effects when relevant instead of treating the macro body as unknown.

  Do not use an Operation inventory. Do not classify vulnerabilities, judge
  safe/unsafe, generate safety requirements, or repeat State/Value relationships.

  Execution owns conditions established by guards, early returns, break/continue,
  loop conditions, switch cases, short-circuit evaluation, mutually exclusive paths,
  and directly supported dominance/reachability.

  Prefer a strong compressed downstream implication over raw branch inventory.
  Example:
      if (i < 0) return;
      if (i >= n) return;
  may be represented as:
      continuing execution after these checks implies 0 <= i < n

  Do not dump the CFG, plain statement ordering, or ordinary business-logic branches.
  Keep only conditions plausibly capable of constraining a later memory, resource,
  pointer, index, size, or numeric safety decision.

  Do not propagate a condition beyond a point where an involved entity may be
  modified or unknown external behavior prevents establishing continuity.
  Merge multiple guards when they jointly establish one concise condition.

  entities lists the source entities directly constrained.
  claim states the execution implication concisely.
  evidence contains only source-grounded lines, each written as L<number>: exact text.
  For a macro-definition line, the final physical-line continuation backslash may
  be omitted; do not otherwise rewrite or paraphrase the cited source text.

  Empty output is valid.
  Return exactly one JSON object matching the schema and no prose.

user_prompt_template: |
  code:
    language: C/C++
    numbered: true
    scope: full_target_function_with_original_line_numbers
    value: |
      {numbered_function_code}

  return_json_schema:
    executions:
      - entities:
          - i
        claim: string
        evidence: string

output_schema:
  executions:
    - entities:
        - string
      claim: string
      evidence: string
