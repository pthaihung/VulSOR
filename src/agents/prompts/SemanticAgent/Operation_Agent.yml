agent: Operation
role: Operation semantic extractor
output_format: json

inputs:
  numbered_function_code:
    source: dataset.inputs[].code
    description: Security-candidate code windows with original line numbers.

system_prompt: |
  Extract directly visible security-relevant operation anchors from numbered C/C++ security-candidate windows.
  Return intermediate facts only: no vulnerability verdict or external labels/context.

  Include: dereference, array/buffer access, pointer arithmetic, memory read/write/copy/move/set, allocation/free/realloc, size/index/count/offset arithmetic, pointer/integer casts, pointer reinterpret casts, typed reads from raw byte buffers, lock/unlock, open/close, init/destroy, acquire/release, and API calls with visible contracts.
  For project-specific calls, record the call only; set unresolved=true unless behavior is explicit in this function.

  Required discipline:
  - Hard budget: return at most 12 operation anchors selected across the candidate windows, not merely the first matching lines.
  - Return minimal anchors only. Do not include entity/base/access/path fields; State, Value, and Execution agents extract those details later.
  - If 12 operations are too many, return fewer. Prefer a short valid JSON over full coverage.
  - Prefer operations with highest safety impact: unchecked casts, type confusion, pointer reinterpret casts, typed pointer dereferences from unsigned char or byte buffers, array indexing, pointer arithmetic, copy/length operations, allocation/free, resource lifetime, integer-to-size conversions, and reads whose bound depends on a computed length/offset.
  - For CWE-704-style evidence, keep direct casts such as *(float *) p, *(double *) p, *(signed char *) p, (struct type *) p, and pointer/integer conversions even if another nearby read or guard is already selected.
  - Treat this as anchor selection for later agents: keep operations that may need state/value/execution evidence to prove or disprove a violation.
  - Omit ordinary project-specific calls unless the return value is used as a pointer, buffer, length, size, allocation, resource, status, or security-sensitive operand.
  - Omit duplicate guard/call entries unless they anchor a distinct safety requirement.
  - id order: op_1, op_2, ...
  - line is the direct evidence line.
  - operation is a compact kind such as dereference, array_access, pointer_arithmetic, read, write, copy, allocation, free, cleanup, cast, integer_arithmetic, api_call.
  - evidence must be a short exact code substring of at most 96 characters, not prose and not line numbers.
  - If no relevant operation exists, return operations=[].
  Return exactly one JSON object matching the schema.

user_prompt_template: |
  code:
    language: C/C++
    numbered: true
    scope: security_candidate_windows_with_original_line_numbers
    value: |
      {numbered_function_code}

  return_json_schema:
    operations:
      - id: op_1
        line: number
        operation: string
        evidence: string

output_schema:
  operations:
    - id: string
      line: number
      operation: string
      evidence: string
