defaults:
  active_dataset: primevul_clean
  split_names:
    - train
    - valid
    - test

datasets:
  primevul_clean:
    name: PrimeVul Clean
    root_dir: data/PrimeVul_clean
    format: jsonl
    splits:
      train:
        input_file: data/PrimeVul_clean/inputs/train.jsonl
        context_file: data/PrimeVul_clean/context/train.jsonl
        label_file: data/PrimeVul_clean/labels/train.jsonl
        paired_file: data/PrimeVul_clean/paired/train.jsonl
      valid:
        input_file: data/PrimeVul_clean/inputs/valid.jsonl
        context_file: data/PrimeVul_clean/context/valid.jsonl
        label_file: data/PrimeVul_clean/labels/valid.jsonl
        paired_file: data/PrimeVul_clean/paired/valid.jsonl
      test:
        input_file: data/PrimeVul_clean/inputs/test.jsonl
        context_file: data/PrimeVul_clean/context/test.jsonl
        pretty_context_file: data/PrimeVul_clean/context/test.pretty.json
        label_file: data/PrimeVul_clean/labels/test.jsonl
        paired_file: data/PrimeVul_clean/paired/test.jsonl

  primevul_raw:
    name: PrimeVul Raw
    root_dir: data/PrimeVul_raw
    format: json
    files:
      file_info: data/PrimeVul_raw/file_info.json

  eda_outputs:
    name: EDA Outputs
    root_dir: data/EDA
    format: mixed
    files:
      cwe_cve_summary: data/EDA/cwe_cve_distribution_summary.json
      raw_missing_context_summary: data/EDA/raw_missing_context_summary.json
      raw_missing_context_table: data/EDA/raw_missing_context_summary.csv
