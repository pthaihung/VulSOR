provider:
  name: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key:
    source: keyboard
    prompt: "Enter OpenRouter API key: "
    env_fallback: OPENROUTER_API_KEY
  default_headers:
    http_referer: null
    x_title: VulB

agents:
  operation_agent:
    name: OperationAgent
    enabled: true
    prompt_file: src/agents/prompts/SemanticAgent/Operation_Agent.yml
    llm:
      provider: openrouter
      model: qwen/qwen3-coder-plus
      temperature: 0.0
      max_tokens: 8192
      timeout_seconds: 120
      response_format: json
      reasoning:
        enabled: false
        effort: low
    quality_gates:
      max_retries: 2

  state_agent:
    name: StateAgent
    enabled: true
