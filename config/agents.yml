provider:
  name: deepseek
  base_url: https://api.deepseek.com
  api_key:
    source: keyboard
    prompt: "Enter DeepSeek API key: "
    env_fallback: DEEPSEEK_API_KEY
  default_headers:
    http_referer: null
    x_title: VulB
  cache:
    enabled: true
    dir: .cache/llm

agents:
  operation_agent:
    name: OperationAgent
    enabled: true
    prompt_file: src/agents/prompts/SemanticAgent/Operation_Agent.yml
    llm:
      provider: deepseek
      model: deepseek-v4-flash
      temperature: 0.0
      max_tokens: 8192
      timeout_seconds: 120
      response_format: json
      reasoning:
        enabled: false
        effort: low
    quality_gates:
      max_retries: 0

  state_agent:
    name: StateAgent
    enabled: true
    prompt_file: src/agents/prompts/SemanticAgent/State_Agent.yml
    llm:
      provider: deepseek
      model: deepseek-v4-flash
      temperature: 0.0
