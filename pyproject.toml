[project]
name = "vulsor"
version = "0.1.0"
description = "Inference/evaluation framework for function-level C/C++ vulnerability detection via semantic obligations."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vulsor = "vulsor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

