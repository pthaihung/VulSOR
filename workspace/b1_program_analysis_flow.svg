<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">VulSOR B1 Program Analysis Flow</title>
  <desc id="desc">Flow diagram showing how VulSOR B1 processes source or dataset input into brain_context artifacts for B2.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .phase { font: 700 15px Arial, sans-serif; letter-spacing: .6px; fill: #334155; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 14px Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px Arial, sans-serif; fill: #64748b; }
      .code { font: 400 13px Consolas, monospace; fill: #0f172a; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .soft-arrow { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
      .card { stroke-width: 1.3; rx: 8; }
      .input { fill: #e0f2fe; stroke: #0284c7; }
      .context { fill: #ecfdf5; stroke: #059669; }
      .tool { fill: #fff7ed; stroke: #ea580c; }
      .facts { fill: #f5f3ff; stroke: #7c3aed; }
      .output { fill: #fefce8; stroke: #ca8a04; }
      .warn { fill: #fff1f2; stroke: #e11d48; }
      .note { fill: #ffffff; stroke: #cbd5e1; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="920"/>

  <text class="title" x="60" y="62">VulSOR B1 - Program Analysis Flow</text>
  <text class="subtitle" x="60" y="92">B1 chỉ tạo program facts và metadata độ đầy đủ; không sinh verdict, CWE/CVE, hoặc kết luận vulnerability.</text>

  <text class="phase" x="70" y="145">1. INPUT</text>
  <text class="phase" x="365" y="145">2. SOURCE CONTEXT</text>
  <text class="phase" x="700" y="145">3. CLANG + PARSERS</text>
  <text class="phase" x="1010" y="145">4. FACT PACKAGE</text>

  <rect class="card input" x="60" y="170" width="250" height="115"/>
  <text class="box-title" x="82" y="204">Inspect / Run</text>
  <text class="box-text" x="82" y="232">source-file hoặc dataset</text>
  <text class="code" x="82" y="258">inspect --file sample.c</text>

  <rect class="card input" x="60" y="330" width="250" height="140"/>
  <text class="box-title" x="82" y="364">Dataset JSONL</text>
  <text class="box-text" x="82" y="392">data/{dataset}/inputs/{split}.jsonl</text>
  <text class="box-text" x="82" y="418">sample_id + code</text>
  <text class="small" x="82" y="445">VD: primevul / test / test_000000</text>

  <rect class="card context" x="365" y="170" width="275" height="135"/>
  <text class="box-title" x="387" y="204">Context Sidecar</text>
  <text class="box-text" x="387" y="232">data/.../context/{split}.jsonl</text>
  <text class="box-text" x="387" y="258">target function, whole file,</text>
  <text class="box-text" x="387" y="282">compile flags, call context</text>

  <rect class="card context" x="365" y="350" width="275" height="165"/>
  <text class="box-title" x="387" y="384">Source Selection</text>
  <text class="box-text" x="387" y="412">analysis_scope = auto/function/file</text>
  <text class="box-text" x="387" y="438">auto: ưu tiên whole file nếu có</text>
  <text class="box-text" x="387" y="464">fallback: function snippet</text>
  <text class="small" x="387" y="492">Không dùng label/CWE làm input.</text>

  <rect class="card tool" x="700" y="170" width="250" height="135"/>
  <text class="box-title" x="722" y="204">Temp Source</text>
  <text class="box-text" x="722" y="232">Tạo file tạm</text>
  <text class="code" x="722" y="258">vulsor-b1-*/input.c</text>
  <text class="small" x="722" y="282">suffix theo .c/.cpp/...</text>

  <rect class="card tool" x="700" y="350" width="250" height="160"/>
  <text class="box-title" x="722" y="384">Clang Passes</text>
  <text class="box-text" x="722" y="412">dump AST JSON</text>
  <text class="box-text" x="722" y="438">dump CFG</text>
  <text class="box-text" x="722" y="464">allow_errors=True</text>
  <text class="small" x="722" y="492">Giữ AST recoverable nếu CFG lỗi.</text>

  <rect class="card facts" x="1000" y="170" width="315" height="170"/>
  <text class="box-title" x="1022" y="204">ProgramFacts</text>
  <text class="box-text" x="1022" y="232">functions, operations</text>
  <text class="box-text" x="1022" y="258">definitions, uses</text>
  <text class="box-text" x="1022" y="284">control_flow, cfg_blocks</text>
  <text class="box-text" x="1022" y="310">call_graph</text>

  <rect class="card facts" x="1000" y="385" width="315" height="160"/>
  <text class="box-title" x="1022" y="419">Derived Links</text>
  <text class="box-text" x="1022" y="447">syntactic data_flow</text>
  <text class="box-text" x="1022" y="473">function_links</text>
  <text class="box-text" x="1022" y="499">operation_call_links</text>
  <text class="box-text" x="1022" y="525">definition_use_links</text>

  <rect class="card warn" x="365" y="590" width="275" height="135"/>
  <text class="box-title" x="387" y="624">Completeness</text>
  <text class="box-text" x="387" y="652">ast: available/recovered</text>
  <text class="box-text" x="387" y="678">cfg: available/missing</text>
  <text class="box-text" x="387" y="704">data_flow: available/limited/empty</text>

  <rect class="card warn" x="700" y="590" width="250" height="135"/>
  <text class="box-title" x="722" y="624">Missing Context</text>
  <text class="box-text" x="722" y="652">unknown_type</text>
  <text class="box-text" x="722" y="678">undeclared_identifier</text>
  <text class="box-text" x="722" y="704">missing headers/macros/flags</text>

  <rect class="card output" x="1000" y="620" width="315" height="160"/>
  <text class="box-title" x="1022" y="654">B1 Artifacts</text>
  <text class="code" x="1022" y="684">brain_context/{dataset}/{split}/</text>
  <text class="code" x="1022" y="710">  {sample_id}.json</text>
  <text class="code" x="1022" y="736">  manifest.json</text>
  <text class="small" x="1022" y="762">B2 đọc từ đây.</text>

  <rect class="card note" x="60" y="590" width="250" height="135"/>
  <text class="box-title" x="82" y="624">Policy Boundary</text>
  <text class="box-text" x="82" y="652">facts only</text>
  <text class="box-text" x="82" y="678">no verdict</text>
  <text class="box-text" x="82" y="704">no CWE/CVE as input</text>

  <path class="arrow" d="M 310 228 C 335 228, 340 228, 365 228"/>
  <path class="arrow" d="M 310 400 C 335 400, 340 400, 365 420"/>
  <path class="arrow" d="M 503 305 L 503 350"/>
  <path class="arrow" d="M 640 432 C 670 432, 670 238, 700 238"/>
  <path class="arrow" d="M 825 305 L 825 350"/>
  <path class="arrow" d="M 950 430 C 975 430, 975 255, 1000 255"/>
  <path class="arrow" d="M 1158 340 L 1158 385"/>
  <path class="arrow" d="M 640 658 C 660 658, 675 658, 700 658"/>
  <path class="soft-arrow" d="M 825 510 L 825 590"/>
  <path class="soft-arrow" d="M 950 658 C 970 658, 975 700, 1000 700"/>
  <path class="arrow" d="M 1158 545 L 1158 620"/>

  <text class="small" x="60" y="840">Main code refs: src/vulsor/cli.py::_analyze_dataset_sample, _write_brain_context_artifacts; src/vulsor/analysis/program.py::analyze_source_code_tolerant.</text>
</svg>
